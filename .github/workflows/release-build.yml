name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (e.g. 1.2)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-stable
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/stable'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ready: ${{ steps.version.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: stable
          fetch-depth: 0
      - name: Prepare version through a pull request
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/version.py "$VERSION" --bump
          if git diff --quiet -- whoa-type.xcodeproj/project.pbxproj; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="release/v$VERSION"
          existing=$(gh pr list --base stable --head "$branch" --json url --jq '.[0].url // empty')
          if [[ -z "$existing" ]]; then
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add whoa-type.xcodeproj/project.pbxproj
            git commit -m "chore(release): prepare v$VERSION"
            git push origin "HEAD:refs/heads/$branch"
            existing=$(gh pr create --base stable --head "$branch" \
              --title "chore(release): prepare v$VERSION" \
              --body 'Merge after CI passes, then rerun Release with the same version. Approve workflow runs on this bot-created PR when prompted.')
          fi
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo "Merge $existing, then rerun Release with version $VERSION." >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: prepare
    if: always() && !cancelled() && (github.event_name == 'push' || needs.prepare.outputs.ready == 'true')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'stable' || github.ref }}
          fetch-depth: 0
      - name: Tag the merged version for a UI release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/version.py "$VERSION"
          if ! git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "refs/tags/v$VERSION"
          fi
          # GITHUB_TOKEN pushes do not trigger another workflow; continue here.
      - name: Resolve tag and require membership in stable
        id: release
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$EVENT" == workflow_dispatch ]]; then tag="v$INPUT_VERSION"; fi
          version="${tag#v}"
          python3 scripts/version.py "$version"
          git fetch origin stable --tags
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$commit" origin/stable || {
            echo 'Tagged commit is not on stable.' >&2
            exit 1
          }
          git checkout --detach "$commit"
          python3 scripts/version.py "$version" --bump
          git diff --exit-code -- whoa-type.xcodeproj/project.pbxproj
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure optional signing
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/configure-signing.sh
      - name: Build DMG
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/build-dmg.sh "$VERSION"
      - name: Publish DMG and generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ "$SIGNED" == true ]]; then
            echo 'Developer ID signed and notarized macOS universal build.' > build/release/notes.md
          else
            echo 'Unsigned build: Developer ID signing and Apple notarization were unavailable because signing secrets are missing.' > build/release/notes.md
          fi
          # Explicitly select the previous reachable version tag.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          printf '\nCommits in this release:\n' >> build/release/notes.md
          range="$TAG"
          if [[ -n "$previous" ]]; then range="$previous..$TAG"; fi
          git log --format='- %s (%h)' "$range" >> build/release/notes.md
          args=()
          if [[ -n "$previous" ]]; then args+=(--notes-start-tag "$previous"); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --generate-notes "${args[@]}" --notes-file build/release/notes.md
          fi
          gh release upload "$TAG" "build/release/WhoaType-$VERSION-macOS.dmg" --clobber
          gh release edit "$TAG" --draft=false
      - name: Open a cask update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="$PWD/build/release/WhoaType-$VERSION-macOS.dmg"
          git checkout stable
          git pull --ff-only origin stable
          python3 Tools/generate-cask.py "$artifact" --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY"
          brew tap-new --no-git WhoaStudio/release-validation
          mkdir -p "$(brew --repository WhoaStudio/release-validation)/Casks"
          cp Casks/whoa-type.rb "$(brew --repository WhoaStudio/release-validation)/Casks/whoa-type.rb"
          if brew help trust >/dev/null 2>&1; then
            brew trust --cask WhoaStudio/release-validation/whoa-type
          fi
          brew audit --cask --strict WhoaStudio/release-validation/whoa-type
          brew style Casks/whoa-type.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/whoa-type.rb
          if ! git diff --cached --quiet; then
            branch="release/cask-$VERSION"
            existing=$(gh pr list --base stable --head "$branch" --json url --jq '.[0].url // empty')
            if [[ -n "$existing" ]]; then
              echo "Cask update already pending: $existing" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git switch -c "$branch"
            git commit -m "chore(cask): update cask to $VERSION"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --base stable --head "$branch" \
              --title "chore(cask): update cask to $VERSION" \
              --body 'Update the cask for the published release. Approve workflow runs on this bot-created PR when prompted, then merge after CI passes.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/whoa-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/whoa-certificate.p12"
