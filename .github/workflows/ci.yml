name: CI
on:
  pull_request:
  push:
    branches: [stable]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build app
        run: |
          xcodebuild -project whoa-type.xcodeproj -scheme whoa-type \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Core tests
        run: swift test
