name: CI
on:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test core
        run: swift test
      - name: Build app without signing
        run: |
          xcodebuild -quiet -project whoa-type.xcodeproj -scheme whoa-type \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/whoa-type-ci" CODE_SIGNING_ALLOWED=NO build
      - name: Test updater preference persistence and status messages
        run: scripts/test-updater.sh "$RUNNER_TEMP/whoa-type-ci"
